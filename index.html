<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jay Game Website</title>
  <style>
    :root {
      --bg-dark: #050a18;
      --card-bg: rgba(10, 16, 32, 0.92);
      --card-border: rgba(56, 189, 248, 0.4);
      --lime: #c8f53b;
      --purple: #7c3aed;
      --cyan: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #050a18;
      color: #ffffff;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 20% 25%, rgba(14, 165, 233, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(79, 70, 229, 0.28) 0%, transparent 50%),
        linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 38px 38px, 38px 38px;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 4%; background: rgba(5, 10, 24, 0.95);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3);
      position: sticky; top: 0; z-index: 100; gap: 16px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 12px; color: white; cursor: pointer; }
    .pixel-logo { display: flex; flex-direction: column; align-items: center; line-height: 1; }
    .crown-svg { width: 32px; height: 20px; filter: drop-shadow(0 0 6px #38bdf8); }
    .pixel-jay { font-family: monospace; font-weight: 900; font-size: 15px; letter-spacing: 2px; color: #38bdf8; margin-top: 2px; }
    .site-title { font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .search-box { flex: 1; max-width: 340px; position: relative; }
    .search-box input {
      width: 100%; padding: 9px 36px 9px 16px; border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.4); background: #0f172a; color: white; font-size: 14px; outline: none;
    }
    .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }
    #portalView { max-width: 1150px; margin: 28px auto; padding: 0 20px 60px; }
    .social-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .social-pill { padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: 13px; text-decoration: none; border: none; cursor: pointer; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px; }
    .game-card {
      background: var(--card-bg); border: 1.5px solid var(--card-border);
      border-radius: 16px; padding: 18px; display: flex; align-items: center; gap: 18px;
    }
    .game-card.playable { border-color: var(--lime); cursor: pointer; box-shadow: 0 0 20px rgba(200, 245, 59, 0.15); }
    .game-card.locked { cursor: not-allowed; opacity: 0.92; }
    .thumb-box {
      width: 96px; height: 96px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 38px;
      background: #02040a; border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .mystery-q { font-size: 44px; font-weight: 900; color: #a855f7; text-shadow: 0 0 14px rgba(168, 85, 247, 0.8); }
    .game-info h3 { font-size: 18px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; line-height: 1.2; }
    .play-pill { display: inline-block; background: var(--lime); color: #050a18; padding: 7px 18px; border-radius: 999px; font-size: 12px; font-weight: 800; }
    .badge { display: inline-flex; border-radius: 999px; overflow: hidden; font-size: 11px; font-weight: 800; }
    .badge-left { background: var(--lime); color: #050a18; padding: 5px 10px; }
    .badge-right { background: var(--purple); color: #fff; padding: 5px 10px; }

    #gameView { display: none; position: fixed; inset: 0; background: #030712; z-index: 200; flex-direction: column; }
    #gameView.active { display: flex; }
    .game-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; background: #0a1020; border-bottom: 1px solid rgba(56, 189, 248, 0.3); gap: 8px; flex-wrap: wrap;
    }
    .stat-pill { background: #0f172a; border: 1px solid var(--cyan); padding: 5px 12px; border-radius: 10px; font-weight: 800; font-size: 13px; color: var(--lime); }
    .top-btn { background: #1e293b; color: white; border: 1px solid rgba(56, 189, 248, 0.4); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; }
    .top-btn.accent { background: var(--purple); border-color: #a855f7; }
    .top-btn.owner-btn { display: none; background: linear-gradient(90deg, #f59e0b, #ef4444); border: none; color: #fff; }
    .top-btn.owner-btn.unlocked { display: inline-block; }

    .arena-wrapper { position: relative; flex: 1; width: 100%; overflow: hidden; touch-action: none; }
    #tycoonCanvas { width: 100%; height: 100%; display: block; }
    .hotbar {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; background: rgba(5, 10, 24, 0.9);
      padding: 6px; border-radius: 14px; border: 1px solid rgba(56, 189, 248, 0.4);
      max-width: 96vw; overflow-x: auto; z-index: 15;
    }
    .slot {
      min-width: 58px; height: 58px; background: #0f172a; border: 1.5px solid #334155;
      border-radius: 10px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer; position: relative; padding: 4px; opacity: 0.45;
    }
    .slot.owned { opacity: 1; border-color: rgba(56, 189, 248, 0.5); }
    .slot.active { border-color: var(--lime); box-shadow: 0 0 12px rgba(200, 245, 59, 0.5); }
    .slot-num { position: absolute; top: 3px; left: 5px; font-size: 9px; color: #94a3b8; font-weight: 800; }
    .slot-icon { font-size: 20px; }
    .slot-name { font-size: 9px; font-weight: 800; text-align: center; margin-top: 2px; line-height: 1; }

    .chat-box {
      position: absolute; top: 10px; left: 10px; width: 280px; max-width: 65vw;
      background: rgba(5, 10, 24, 0.85); border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px; display: flex; flex-direction: column; z-index: 20; overflow: hidden;
    }
    .chat-messages { height: 110px; overflow-y: auto; padding: 8px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
    .chat-input-row { display: flex; border-top: 1px solid rgba(56, 189, 248, 0.25); }
    .chat-input-row input { flex: 1; background: transparent; border: none; color: white; padding: 7px 9px; font-size: 12px; outline: none; }
    .chat-input-row button { background: var(--cyan); color: #050a18; border: none; padding: 0 10px; font-weight: 800; font-size: 11px; cursor: pointer; }

    .touch-stick {
      position: absolute; bottom: 86px; left: 20px; width: 104px; height: 104px;
      background: rgba(56, 189, 248, 0.16); border: 2px solid rgba(56, 189, 248, 0.45);
      border-radius: 50%; z-index: 18; touch-action: none;
    }
    .stick-knob { width: 42px; height: 42px; background: rgba(56, 189, 248, 0.75); border-radius: 50%; position: absolute; top: 29px; left: 29px; pointer-events: none; }
    .touch-actions { position: absolute; bottom: 86px; right: 18px; display: flex; flex-direction: column; gap: 10px; z-index: 18; }
    .action-btn {
      width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--lime);
      background: rgba(15, 23, 42, 0.9); color: var(--lime); font-weight: 800; font-size: 12px; cursor: pointer;
    }
    .vc-btn { border-color: var(--cyan); color: var(--cyan); height: 44px; border-radius: 12px; }
    .vc-btn.active { background: #10b981; border-color: #10b981; color: #050a18; }

    .overlay-modal {
      display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.86);
      z-index: 500; align-items: center; justify-content: center; padding: 16px;
    }
    .overlay-modal.open { display: flex; }
    .panel-card {
      background: #0b1224; border: 1.5px solid var(--cyan); border-radius: 16px;
      padding: 20px; width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto;
    }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .panel-header h3 { font-size: 18px; font-weight: 800; color: var(--lime); }
    .close-x { background: #1e293b; color: white; border: none; padding: 6px 11px; border-radius: 8px; cursor: pointer; font-weight: 800; }

    .field-input, .lua-editor {
      width: 100%; background: #040814; border: 1px solid #334155; color: #f8fafc;
      padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 10px; outline: none;
    }
    .lua-editor { font-family: monospace; min-height: 130px; resize: vertical; color: #7dd3fc; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .cmd-btn { padding: 8px 12px; border-radius: 8px; border: none; font-weight: 800; font-size: 12px; cursor: pointer; color: white; background: #1e293b; }
    .cmd-btn.red { background: #dc2626; }
    .cmd-btn.green { background: #16a34a; }
    .cmd-btn.blue { background: #0284c7; }
    .cmd-btn.lime { background: var(--lime); color: #050a18; }
    .cmd-btn.purple { background: var(--purple); }

    .script-item { background: #0f172a; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; }
    .script-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .vis-tag { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #334155; color: #e2e8f0; }
