<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Jay Game Website</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg-dark: #050a18;
      --card-bg: rgba(10, 16, 32, 0.9);
      --card-border: rgba(56, 189, 248, 0.35);
      --lime: #c8f53b;
      --purple: #7c3aed;
      --cyan: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 20% 25%, rgba(14, 165, 233, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 80% 70%, rgba(79, 70, 229, 0.28) 0%, transparent 50%),
        linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 38px 38px, 38px 38px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 4%;
      background: rgba(5, 10, 24, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: white; cursor: pointer; }
    .pixel-logo { display: flex; flex-direction: column; align-items: center; line-height: 1; }
    .crown-svg { width: 32px; height: 20px; filter: drop-shadow(0 0 6px #38bdf8); }
    .pixel-jay {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      background: linear-gradient(180deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 2px;
    }
    .site-title { font-size: 20px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }

    .search-box { flex: 1; max-width: 340px; position: relative; }
    .search-box input {
      width: 100%;
      padding: 9px 36px 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(15, 23, 42, 0.95);
      color: white;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; }

    #portalView { max-width: 1150px; margin: 28px auto; padding: 0 20px 60px; }

    .social-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .social-pill {
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .social-pill:hover { transform: translateY(-2px); }

    .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }

    .game-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 18px;
      backdrop-filter: blur(8px);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .game-card.playable { border-color: var(--lime); cursor: pointer; box-shadow: 0 0 20px rgba(200, 245, 59, 0.15); }
    .game-card.playable:hover { transform: translateY(-4px); box-shadow: 0 10px 28px rgba(200, 245, 59, 0.3); }
    .game-card.locked { cursor: not-allowed; opacity: 0.92; }

    .thumb-box {
      width: 100px; height: 100px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 40px;
      background: #02040a; border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .mystery-q { font-size: 44px; font-weight: 800; color: transparent; -webkit-text-stroke: 2px #a855f7; text-shadow: 0 0 14px rgba(168, 85, 247, 0.75); }

    .game-info h3 { font-size: 19px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; line-height: 1.2; }
    .play-pill {
      display: inline-block; background: var(--lime); color: #050a18;
      padding: 7px 18px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: 0.5px;
    }
    .badge { display: inline-flex; border-radius: 999px; overflow: hidden; font-size: 11px; font-weight: 800; }
    .badge-left { background: var(--lime); color: #050a18; padding: 5px 10px; }
    .badge-right { background: var(--purple); color: #fff; padding: 5px 10px; }

    #gameView { display: none; position: fixed; inset: 0; background: #030712; z-index: 200; flex-direction: column; }
    #gameView.active { display: flex; }

    .game-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 14px; background: rgba(10, 16, 32, 0.95);
      border-bottom: 1px solid rgba(56, 189, 248, 0.3); gap: 8px; flex-wrap: wrap;
    }
    .stat-pill {
      background: #0f172a; border: 1px solid var(--cyan); padding: 5px 12px;
      border-radius: 10px; font-weight: 800; font-size: 13px; color: var(--lime);
    }
    .top-btn {
      background: #1e293b; color: white; border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer;
    }
    .top-btn.accent { background: var(--purple); border-color: #a855f7; }
    .top-btn.owner-btn { display: none; background: linear-gradient(90deg, #f59e0b, #ef4444); border: none; color: #fff; }
    .top-btn.owner-btn.unlocked { display: inline-block; }

    .arena-wrapper { position: relative; flex: 1; width: 100%; overflow: hidden; touch-action: none; }
    #tycoonCanvas { width: 100%; height: 100%; display: block; }

    .hotbar {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; background: rgba(5, 10, 24, 0.85);
      padding: 6px; border-radius: 14px; border: 1px solid rgba(56, 189, 248, 0.35);
      max-width: 96vw; overflow-x: auto; z-index: 15;
    }
    .slot {
      min-width: 58px; height: 58px; background: #0f172a; border: 1.5px solid #334155;
      border-radius: 10px; display: flex; flex-direction: column; align-items: center;
      justify-content: center; cursor: pointer; position: relative; padding: 4px;
      opacity: 0.45; transition: 0.15s;
    }
    .slot.owned { opacity: 1; border-color: rgba(56, 189, 248, 0.5); }
    .slot.active { border-color: var(--lime); box-shadow: 0 0 12px rgba(200, 245, 59, 0.5); transform: translateY(-3px); }
    .slot-num { position: absolute; top: 3px; left: 5px; font-size: 9px; color: #94a3b8; font-weight: 800; }
    .slot-icon { font-size: 20px; }
    .slot-name { font-size: 9px; font-weight: 800; text-align: center; margin-top: 2px; line-height: 1; }

    .chat-box {
      position: absolute; top: 10px; left: 10px; width: 280px; max-width: 65vw;
      background: rgba(5, 10, 24, 0.8); backdrop-filter: blur(6px);
      border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px;
      display: flex; flex-direction: column; z-index: 20; overflow: hidden;
    }
    .chat-messages {
      height: 115px; overflow-y: auto; padding: 8px; font-size: 12px;
      display: flex; flex-direction: column; gap: 4px;
    }
    .chat-msg { line-height: 1.3; word-break: break-word; }
    .chat-input-row { display: flex; border-top: 1px solid rgba(56, 189, 248, 0.25); }
    .chat-input-row input {
      flex: 1; background: transparent; border: none; color: white;
      padding: 7px 9px; font-size: 12px; outline: none; font-family: inherit;
    }
    .chat-input-row button {
      background: var(--cyan); color: #050a18; border: none; padding: 0 10px;
      font-weight: 800; font-size: 11px; cursor: pointer;
    }

    .touch-stick {
      position: absolute; bottom: 86px; left: 20px; width: 104px; height: 104px;
      background: rgba(56, 189, 248, 0.14); border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 50%; z-index: 18; touch-action: none;
    }
    .stick-knob {
      width: 42px; height: 42px; background: rgba(56, 189, 248, 0.7);
      border-radius: 50%; position: absolute; top: 29px; left: 29px; pointer-events: none;
    }
    .touch-actions {
      position: absolute; bottom: 86px; right: 18px; display: flex; flex-direction: column;
      gap: 10px; z-index: 18;
    }
    .action-btn {
      width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--lime);
      background: rgba(15, 23, 42, 0.85); color: var(--lime); font-weight: 800;
      font-size: 12px; cursor: pointer; box-shadow: 0 0 14px rgba(200, 245, 59, 0.3);
    }
    .action-btn:active { background: var(--lime); color: #050a18; }
    .vc-btn { border-color: var(--cyan); color: var(--cyan); height: 44px; border-radius: 12px; }
    .vc-btn.active { background: #10b981; border-color: #10b981; color: #050a18; }

    .overlay-modal {
      display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.84);
      backdrop-filter: blur(6px); z-index: 500; align-items: center; justify-content: center; padding: 16px;
    }
    .overlay-modal.open { display: flex; }
    .panel-card {
      background: #0b1224; border: 1.5px solid var(--cyan); border-radius: 16px;
      padding: 20px; width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto;
box-shadow: 0 0 35px rgba(56, 189, 248, 0.35);
}
.panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.panel-header h3 { font-size: 18px; font-weight: 800; color: var(--lime); }
.close-x { background: #1e293b; color: white; border: none; padding: 6px 11px; border-radius: 8px; cursor: pointer; font-weight: 800; }
.field-input, .lua-editor {
width: 100%; background: #040814; border: 1px solid #334155; color: #f8fafc;
padding: 10px; border-radius: 10px; font-family: inherit; font-size: 13px; margin-bottom: 10px; outline: none;
}
.lua-editor { font-family: 'Fira Code', monospace; min-height: 140px; resize: vertical; color: #7dd3fc; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.cmd-btn {
padding: 8px 12px; border-radius: 8px; border: none; font-weight: 800; font-size: 12px;
cursor: pointer; color: white; background: #1e293b;
}
.cmd-btn.red { background: #dc2626; }
.cmd-btn.green { background: #16a34a; }
.cmd-btn.blue { background: #0284c7; }
.cmd-btn.lime { background: var(--lime); color: #050a18; }
.cmd-btn.purple { background: var(--purple); }
.script-item {
background: #0f172a; border: 1px solid #1e293b; border-radius: 10px;
padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px;
}
.script-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.vis-tag { font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: #334155; color: #e2e8f0; }
.vis-tag.public { background: rgba(16, 185, 129, 0.25); color: #34d399; border: 1px solid #10b981; }
.toast {
position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
background: #0f172a; border: 1.5px solid var(--lime); color: white;
padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 13px;
z-index: 999; display: none; box-shadow: 0 8px 25px rgba(0,0,0,0.7);
}

let toastTimeout;
function showToast(msg) {
const t = document.getElementById('toastBox');
t.textContent = msg;
t.style.display = 'block';
clearTimeout(toastTimeout);
toastTimeout = setTimeout(() => t.style.display = 'none', 2600);
}
function filterPortal() {
const q = document.getElementById('searchInput').value.toLowerCase();
document.querySelectorAll('#portalGrid .game-card').forEach(c => {
c.style.display = c.dataset.title.includes(q) ? 'flex' : 'none';
});
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
let activeRoom = '#general-chat';
function switchSocialRoom(room) {
activeRoom = room;
document.getElementById('socialRoomTitle').textContent = room;
document.getElementById('socialFeed').innerHTML = <div><strong style="color:#38bdf8;">[System]:</strong> Switched to <strong>${room}</strong>.</div>;
}
function postSocialMsg() {
const user = document.getElementById('socialUser').value.trim() || (state.isOwner ? '👑 Jay (Owner)' : 'Guest');
const msgInput = document.getElementById('socialMsg');
const txt = msgInput.value.trim();
if (!txt) return;
msgInput.value = '';
const feed = document.getElementById('socialFeed');
const row = document.createElement('div');
row.innerHTML = <strong style="color:#c8f53b;">${user}:</strong> ;
row.appendChild(document.createTextNode(txt));
feed.appendChild(row);
feed.scrollTop = feed.scrollHeight;
}

function updateHud() {
document.getElementById('cashHud').textContent = '$' + Math.floor(state.cash).toLocaleString();
document.getElementById('rebirthHud').textContent = 'Rebirths: ' + state.rebirths;
renderHotbar();
}
function renderHotbar() {
const hb = document.getElementById('hotbar');
hb.innerHTML = '';
WEAPONS.forEach((w, idx) => {
const owned = state.ownedWeapons.includes(w.id);
const div = document.createElement('div');
div.className = 'slot' + (owned ? ' owned' : '') + (state.equipped === w.id ? ' active' : '');
div.innerHTML = <span class="slot-num">${idx + 1}</span><span class="slot-icon">${w.icon}</span><span class="slot-name">${w.id}</span>;
div.onclick = () => {
if (owned) { state.equipped = w.id; renderHotbar(); }
else showToast(Step on the ${w.id} pad ($${w.cost}) to unlock!);
};
hb.appendChild(div);
});
}
function unlockAllWeapons() {
state.ownedWeapons = WEAPONS.map(w => w.id);
renderHotbar();
showToast('👑 All 8 Weapons & Abilities Unlocked!');
}
function appendChat(sender, text, color = '#f8fafc') {
const feed = document.getElementById('chatFeed');
const line = document.createElement('div');
line.className = 'chat-msg';
line.style.color = color;
line.innerHTML = <strong>[${sender}]:</strong> ;
line.appendChild(document.createTextNode(text));
feed.appendChild(line);
feed.scrollTop = feed.scrollHeight;
}
function sendChat() {
const input = document.getElementById('chatInput');
const raw = input.value.trim();
input.value = '';
if (!raw) return;
if (raw === '/Jay Admin Panel v2') {
if (state.isOwner) {
openOwnerPanel();
} else {
openModal('passModal');
setTimeout(() => document.getElementById('ownerPassInput').focus(), 100);
}
return;
}
if (state.mutedUsers.includes(state.username)) {
showToast('🔇 You are muted by the Owner.');
return;
}
const tag = state.isOwner ? 'Jay (Owner)' : state.username;
const col = state.isOwner ? '#c8f53b' : '#ffffff';
appendChat(tag, raw, col);
}
function verifyOwner() {
const val = document.getElementById('ownerPassInput').value;
document.getElementById('ownerPassInput').value = '';
if (val === 'Kamron98') {
state.isOwner = true;
state.username = 'Jay';
closeModal('passModal');
document.getElementById('ownerOpenBtn').classList.add('unlocked');
openOwnerPanel();
showToast('👑 Owner Panel v2 Unlocked!');
} else {
showToast('❌ Invalid Passcode.');
}
}
function openOwnerPanel() {
if (!state.isOwner) return;
openModal('ownerModal');
}
function adminAction(type) {
if (!state.isOwner) return;
const target = document.getElementById('targetPlayerInput').value.trim();
if (!target) return showToast('Enter a username first.');
const bot = state.bots.find(b => b.name.toLowerCase() === target.toLowerCase());
if (type === 'kick') {
if (bot) bot.kicked = true;
appendChat('System', ${target} was kicked by Owner Jay., '#f87171');
} else if (type === 'ban') {
if (bot) bot.kicked = true;
if (!state.bannedUsers.includes(target)) state.bannedUsers.push(target);
appendChat('System', ${target} was permanently banned by Owner Jay., '#ef4444');
} else if (type === 'unban') {
state.bannedUsers = state.bannedUsers.filter(u => u.toLowerCase() !== target.toLowerCase());
if (bot) { bot.kicked = false; bot.hp = bot.maxHp; }
appendChat('System', ${target} was unbanned by Owner Jay., '#34d399');
} else if (type === 'mute') {
if (state.mutedUsers.includes(target)) {
state.mutedUsers = state.mutedUsers.filter(u => u !== target);
appendChat('System', ${target} was unmuted., '#38bdf8');
} else {
state.mutedUsers.push(target);
appendChat('System', ${target} was muted by Owner Jay., '#fbbf24');
}
}
document.getElementById('banListDisplay').textContent =
Banned: ${state.bannedUsers.length ? state.bannedUsers.join(', ') : 'None'} | Muted: ${state.mutedUsers.length ? state.mutedUsers.join(', ') : 'None'};
}
function togglePublicExecutor() {
state.publicExecEnabled = !state.publicExecEnabled;
document.getElementById('togglePublicExecBtn').textContent = 'Public Executor: ' + (state.publicExecEnabled ? 'ON' : 'OFF');
showToast('Public Lua Executor is now ' + (state.publicExecEnabled ? 'ENABLED' : 'DISABLED'));
}
function toggleVC() {
state.vcOn = !state.vcOn;
const btn = document.getElementById('vcBtn');
btn.textContent = state.vcOn ? '🎙️ VC ON' : '🎙️ VC OFF';
btn.classList.toggle('active', state.vcOn);

__index = function(, k)

end,
__newindex = function(, k, v)
if k == "WalkSpeed" then bridge:setWalkSpeed(v) end
end
})
local cashProxy = setmetatable({}, {
__index = function(, k)
if k == "Value" then return bridge:getCash() end
end,
__newindex = function(, k, v)
if k == "Value" then bridge:setCash(v) end
end
})
local rebirthProxy = setmetatable({}, {
__newindex = function(_, k, v)

end
})
game = {
Players = {
LocalPlayer = {
Character = { Humanoid = humanoidProxy },
leaderstats = { Cash = cashProxy, Rebirths = rebirthProxy }
}
}
}
`;

fengari.load(envHeader + "\n" + userCode)();
