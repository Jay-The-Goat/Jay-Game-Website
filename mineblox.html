<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mineblox — Jay Game Website</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body onload="launchMineblox()">

  <div id="minebloxView" style="display:flex; position:fixed; inset:0; background:#040a14; z-index:210; flex-direction:column;">
    <!-- Custom Animated Mineblox Loading Screen -->
    <div id="mbLoadingScreen" style="position:absolute; inset:0; background:radial-gradient(circle at center, #0c2b1e 0%, #040a14 100%); z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;">
      <div style="font-size:56px; margin-bottom:12px;">⛏️</div>
      <h1 style="font-size:32px; font-weight:900; letter-spacing:3px; color:#c8f53b; margin-bottom:8px;">MINEBLOX ENGINE v2.4</h1>
      <p id="mbLoadStatus" style="color:#38bdf8; font-size:14px; font-weight:700; margin-bottom:18px;">Generating Infinite Voxel Chunks & Multiplayer Session...</p>
      <div style="width:100%; max-width:380px; height:16px; background:#0f172a; border:2px solid #c8f53b; border-radius:999px; overflow:hidden; padding:2px;">
        <div id="mbLoadBar" style="width:0%; height:100%; background:linear-gradient(90deg, #22c55e, #c8f53b); border-radius:999px; transition:width 0.15s;"></div>
      </div>
    </div>

    <div class="game-topbar">
      <div style="display:flex; gap:8px; align-items:center;">
        <a href="index.html" class="top-btn" style="text-decoration:none;">⬅ Portal</a>
        <div class="stat-pill" id="mbRoomHud">🌍 World: PUBLIC-1 (Online)</div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="mbRoomInput" placeholder="Friend Room Code..." style="background:#0f172a; border:1px solid #38bdf8; color:#fff; padding:5px 10px; border-radius:8px; font-size:12px; width:145px;" />
        <button class="top-btn accent" onclick="joinMinebloxRoom()">Join Friend</button>
      </div>
    </div>

    <div class="arena-wrapper" id="mbWrap">
      <canvas id="minebloxCanvas"></canvas>
      <div style="position:absolute; top:12px; left:12px; background:rgba(5,10,24,0.8); border:1px solid #22c55e; padding:8px 12px; border-radius:10px; font-size:12px;">
        <strong>Controls:</strong> WASD / Arrows to Move • Click / Tap to Place Block • Right-Click to Break
      </div>
      <div class="hotbar" id="mbHotbar"></div>
    </div>
  </div>

  <div class="toast" id="toastBox"></div>
  <script src="script.js"></script>
</body>
</html>
